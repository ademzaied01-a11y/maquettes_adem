<style>
:root{
  --ink:#0B1220; --ink-2:#101A2E;
  --gold:#C0A062; --cream:#F6F2EA;

  --font-display:"EB Garamond",Georgia,serif;
  --font-body:"Lato",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-body);background:var(--ink);color:var(--text);
  min-height:100dvh;line-height:1.6;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.container{max-width:68rem;margin-inline:auto;padding:clamp(2rem,6vw,5rem) clamp(1.25rem,4vw,3rem)}
header.page{margin-bottom:clamp(2.5rem,6vw,4.5rem)}
.eyebrow{
  display:flex;align-items:center;gap:.85rem;font-size:.7rem;font-weight:700;
  letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem;
}
.eyebrow::before{content:"";width:2.6rem;height:1px;background:var(--gold)}
h1{font-family:var(--font-display);font-weight:500;font-size:clamp(2.2rem,5.5vw,3.8rem);line-height:1.1}
h1 em{font-style:italic;color:var(--gold)}
.intro{margin-top:1.2rem;max-width:38rem;color:var(--text-2);font-weight:300}
.grid{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fill,minmax(min(19rem,100%),1fr))}
.card{
  border:1px solid var(--line);background:var(--ink-2);padding:2rem;
  display:flex;flex-direction:column;gap:.9rem;position:relative;
  transition:border-color .3s,transform .3s cubic-bezier(.22,1,.36,1);
}
.card:hover,.card:focus-visible{border-color:var(--gold);transform:translateY(-4px)}
.card .type{font-size:.68rem;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.card h2{font-family:var(--font-display);font-weight:500;font-size:1.55rem;color:var(--text)}
.card p{font-size:.92rem;color:var(--text-2);font-weight:300;flex-grow:1}
.card .go{
  display:inline-flex;align-items:center;gap:.6rem;margin-top:.4rem;
  font-size:.75rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
}
.card .go svg{width:1.1rem;height:1.1rem;transition:transform .3s}
.card:hover .go svg{transform:translateX(5px)}
.empty{border:1px dashed var(--line);padding:2rem;color:var(--text-2);font-size:.9rem;font-weight:300}
footer{margin-top:clamp(3rem,8vw,5rem);padding-top:1.5rem;border-top:1px solid var(--line);
  font-size:.75rem;color:var(--text-2);display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
